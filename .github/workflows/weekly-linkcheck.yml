# 每週外部死鏈檢查（分裂架構套用到 lint 這條線）
#
# 為什麼存在：wiki-lint 的「指標三：外部死鏈」原本標為「只能本機執行」，因為
# 雲端 routine 的沙盒 egress 封鎖外部網域。但這一步是**純 HTTP HEAD 請求、
# 完全不需要 LLM**——與每日抓料同一種性質，正好適用 2026-07-10 就定案的分裂
# 架構：「不需 LLM 的網路工作移到 GitHub Actions，需 LLM 的留給有訂閱的環境」。
#
# 這條線從來沒被套用過，代價是死鏈檢查自 2026-07 起一次都沒真正執行：
# 每週 lint 都輸出「雲端跳過，留待本機」，而沒有任何機制保證本機補跑
# （log 佐證：08-01 留待辦 → 08-08「非本月首次，跳過」→ 08-15 再跳過）。
#
# 有了這個 workflow，該步驟不再需要本機、也不再需要雲端連網：Actions 產出
# data/link_health.json，lint 改成讀這個檔並派記者標註失效連結。
#
# 順帶修掉一個 bug：原規格「僅每月第一次 lint 執行」的觸發器會被雲端那次用掉，
# 之後每週都輸出「非本月首次，跳過」。現在檢查有自己的 cron，與 lint 脫鉤。
name: weekly-linkcheck

on:
  schedule:
    # 週五 14:00 UTC = 週五 22:00 台北，早於雲端 weekly lint（週六 03:00 UTC）13 小時。
    # 緩衝的判準與 daily-gather 相同：**必須大於 GitHub 排程的實測變異**（+11.2 小時，
    # 2026-08-28 量得）。原本排 20:00、緩衝 7 小時，那是沿用舊的 2.7 小時變異估計——
    # 日更那條線正是因為同一個誤估連兩天開天窗。緩衝不足時 lint 會讀到**上週的**
    # link_health.json，而 weekly-lint.md 的新鮮度防線門檻是 10 天，7 天的舊報告
    # 照樣通過——於是拿上週資料標死鏈而不自知。
    - cron: "0 14 * * 5"
  workflow_dispatch: {}  # 允許手動觸發（改完規格想立刻產一份報告時用）

concurrency:
  group: weekly-linkcheck
  cancel-in-progress: false

permissions:
  contents: write  # 需要把 link_health.json commit 回 repo 供 lint 讀取

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    # 795 條唯一外部連結、逐條 HEAD（無節流 sleep）。單條上限 10 秒；逾時或連線
    # 失敗會用 25 秒逾時 + GET 重試一次（2026-08-20 加，用來壓掉假死鏈），故單條
    # 最壞 35 秒。實測全量約 15 分鐘；最壞情況（大量逾時）不超過 1 小時，
    # 給 90 分鐘上限——超時視為異常而非常態，讓它紅燈寄信。
    timeout-minutes: 90
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # check_links.py 只用標準庫（urllib），不需要 pip install。

      # 每月 1 號那一週跑全量，其餘週次分層（只驗新連結 + 上次非 OK 者）。
      # 分層省掉約 85% 的請求：795 條裡約 680 條上週正常、這週幾乎必然還正常。
      # 代價：非 OK 之外的連結，失效最多晚一個月被發現——對 wiki 引用的新聞
      # 連結可接受，且不影響死鏈標註的正確性（標註只認 dead 桶，而分層報告
      # 會把沒掃的連結沿用上次結果補回，仍是完整清單）。
      - name: Decide scan mode
        id: mode
        run: |
          if [ "$(date -u +%d)" -le 07 ]; then
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "本月首次（每月 1–7 號）→ 全量掃描"
          else
            echo "flag=--incremental" >> "$GITHUB_OUTPUT"
            echo "→ 分層掃描"
          fi

      - name: Check external links (pure stdlib, no LLM)
        working-directory: .
        # 刻意 `|| true`：這支腳本的 exit code 代表「有沒有死鏈」，而發現死鏈是
        # 這個 job 的**正常產出**，不是執行失敗。若讓它紅燈，紅燈就變成背景雜訊，
        # 真正該告警的事（抓取整個掛掉、timeout）反而沒人分辨得出來。
        # 真正的失敗由下一步「報告是否產出」把關。
        run: python scripts/check_links.py ${{ steps.mode.outputs.flag }} --report data/link_health.json || true

      - name: Verify report was produced
        working-directory: .
        # 沒有報告＝這個 job 實質失敗（腳本崩潰、網路整段不通）。此時要紅燈寄信，
        # 因為 lint 下游會讀到過期報告卻以為是新的——與 daily 的新鮮度防線同理。
        run: |
          test -f data/link_health.json || { echo "報告未產出，視為失敗"; exit 1; }
          python -c "import json,sys; d=json.load(open('data/link_health.json',encoding='utf-8')); print(f\"checked_at={d['checked_at']} mode={d['mode']} 檢查 {d['checked']}/{d['total_unique_links']} 條，死鏈 {len(d['dead'])}、擋機器人 {len(d['anti_bot'])}、無法判定 {len(d['unverified'])}\")"

      - name: Commit link health report
        working-directory: .  # repo root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/link_health.json
          if git diff --cached --quiet; then
            echo "No link-health changes to commit."
            exit 0
          fi
          git commit -m "data: weekly link health report"
          # 與其他自動線同樣走 pull --rebase 重試：雲端 routine 與本機都可能同時 push。
          for i in 1 2 3; do
            git pull --rebase origin master && git push origin master && exit 0
            echo "push 失敗，第 $i 次重試"
            sleep 15
          done
          echo "push 連續三次失敗"; exit 1


# 每日新聞抓取（自動化流水線「階段 ①」）
#
# 這是「GitHub Actions 抓料 + 雲端 routine 做 LLM」分裂架構的第一段。
# 只做純 Python 抓取（不呼叫 LLM、不需 API key），把 gathered_items.json 與
# 去重快取 commit 回 repo，交給雲端 routine（daily-news-pipeline-cloud）接手
# 生成日報 / wiki / 網站。
#
# 為何要在這裡跑而不是雲端 routine：雲端 routine 的沙盒 egress 政策封鎖一般
# 外部網域（Reddit / HN / Google News …回 403），抓不到新聞；GitHub Actions
# runner 網路無限制，且抓取步驟不需 LLM，正好補上缺口。
#
# 手動補救路徑（/news-pipeline）完全不受影響：本檔只是「加上去」的自動路徑。
name: daily-gather

on:
  schedule:
    # 註（2026-08-29）：本檔曾加過一個 00:00 UTC 保險窗，用來對抗 GitHub 排程延遲
    # 10–11 小時導致的下游中止。它被移除，因為那是在**增加生產者**來繞開根因——
    # 根因是下游只排一班、又用時鐘猜資料到了沒。改法是讓下游一天排三班重試
    # （12/17/22 UTC），資料到了就做、沒到留給下一班——不是在這裡加班次。
    # 若哪天「同日送達」變成硬需求，加回 `- cron: "17 0 * * *"` 即可——但要先確認
    # 兩班的**最晚**那班仍蓋得過變異（src/tests/test_daily_gather_schedule.py 會驗）。
    #
    # 分鐘刻意避開整點（2026-08-29）：GitHub 官方文件明載 schedule 事件會在高負載
    # 時延遲，而「每個整點的開始」正是高負載時段，並建議把排程移到整點以外的分鐘。
    # 原本兩班都壓在 :00——尤其 00:00 UTC 是全平台最熱門的 cron 時刻——等於自己
    # 站在最擠的隊伍裡。改為 :17 / :23 不保證解決 10 小時級的延遲（官方事件記錄
    # 顯示 08-27／08-28 的延遲期間並無未結案的 Actions 事件，成因未明），但這是
    # 官方指名的緩解手段且零成本。
    # 10:23 UTC = 18:23 Asia/Taipei。下游雲端 routine 一天排三班重試
    # （12/17/22 UTC），資料到了就做、沒到留給下一班，所以**本班的時間點
    # 不再是正確性依賴**——延遲只讓日報晚幾小時，不會讓它消失。
    # 註：這裡曾經一路加大緩衝——30 分鐘（12:30 UTC）→ 3 小時（10:00 UTC，2026-07-11
    # 實測延遲 1.5–2.7h）→ 11.6 小時（2026-08-29，實測 10–11h 穿透）。最後一版在常態日
    # 是純空等，把送達推到隔日 06:00，故改為下游重試。緩衝式的思路到此為止。
    - cron: "23 10 * * *"

  workflow_dispatch: {}  # 允許手動觸發（測試用）

# 同一時間只跑一個，避免排程與手動觸發重疊造成 push 衝突。
concurrency:
  group: daily-gather
  cancel-in-progress: false

permissions:
  contents: write  # 需要寫入權限把 gathered_items.json / 快取 commit 回 repo

jobs:
  gather:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements_news.txt

      - name: Gather news (Python only, no LLM)
        # GITHUB_TOKEN 是 Actions 每次 run 自帶的臨時 token（額度 1,000 次/小時/repo，
        # 匿名只有 60），config.py 讀同名環境變數，GitHub Issues / releases / Official
        # Skills 三個來源自動帶上；本機執行才需要自己的 PAT。
        # REDDIT_* 未設定時 reddit.py 自動走 RSS 路徑，設定後走 OAuth 拿真實讚數。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python -m news_aggregator.main --gather-only

      # 把當日抓到的原料存一份按日期分檔的副本。
      #
      # 為什麼需要：gathered_items.json 沒有按日分檔，隔天這個 job 會直接覆寫它。
      # 若某天第 ② 段（雲端 routine）失敗，那天「已經抓到手」的新聞會在隔天 10:00
      # 被覆蓋掉，之後本機補跑只能回頭重抓——但來源多是近期視窗的 RSS/API，
      # 幾天前的內容早已滾出視窗，等於那天的新聞永久漏失。
      #
      # 有了這份副本，補跑可以直接replay當天的真實原料（見 .claude/skills/news-gather/SKILL.md
      # 的「補跑（backfill）注意事項」），補得回來且與原本會產出的內容一致。
      # 保留 14 天，與 emitted-cache 的 TTL 一致。
      # 實作在 scripts/archive_gathered.py（本機 Step 1a 呼叫同一支，行為一致）
      - name: Archive today's gathered items (for backfill replay)
        working-directory: .
        run: python scripts/archive_gathered.py

      # 興趣類別 skill 榜（2026-09-03）：對使用者指定類別搜 GitHub，覆寫式快照頁。
      # 放在 gather 之後：共用 GITHUB_TOKEN 額度與 repo_star_history.csv（E 窗記錄端）。
      # 失敗不阻擋後續 commit（continue-on-error）——榜是附加價值，不是日報的前置。
      - name: Skill interest snapshot (GitHub category boards, no LLM)
        working-directory: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/skill_interest_snapshot.py

      - name: Commit gathered data + dedup caches
        working-directory: .  # repo root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 抓料產出路徑清單（單一來源）。CLAUDE.md 明訂任何情境不得 git add -A，
          # 故一律指名路徑；新增產出檔時加進這個陣列即可。
          # scripts/check_workflow_paths.py（掛在 run_tests.py）會驗每一筆都存在——
          # 2026-09-04 事故：09-03 下架 site-source-tooling 時刪了頁面卻漏刪這裡的
          # 登記，git add 撞到不存在的 pathspec 直接 exit 128，整個 commit+push 步驟
          # 連坐失敗 → 當天抓料整包不落地、日報缺一天，而三個抓取步驟全是綠的。
          GATHER_PATHS=(
            src/gathered_items.json
            src/gathered_archive
            src/news_aggregator/emitted_items.json
            src/news_aggregator/seen_urls.json
            src/news_aggregator/sources/official_watch_state.json
            src/news_aggregator/sources/official_skills_repos_state.json
            src/news_aggregator/sources/build_flags_state.json
            data/build_flags_history.jsonl
            data/source_funnel.jsonl
            data/discovery_queue_history.csv
            data/repo_star_history.csv
            wiki/topics/skill-interest-watch.md
          )
          # 逐筆 add：缺件只告警不中止。單一路徑失效不該讓當天的料整包丟掉——
          # 抓料落地優先於清單完整性，缺件由上面那支檢查器在 commit 前先擋下。
          for p in "${GATHER_PATHS[@]}"; do
            if [ -e "$p" ]; then
              git add "$p"
            else
              echo "::warning::抓料產出路徑不存在，已略過（請修 daily-gather.yml 的 GATHER_PATHS）：$p"
            fi
          done
          # 兩個 *_state.json 是清冊型來源（Official Docs / Official Skills）的
          # 「上次看到的樣子」。不 commit → 每次全新 checkout 都拿 repo 舊基線比對，
          # 同一筆異動天天重複偵測，且 state 只有本機手動跑才會前進（2026-08-15 發現：
          # 08-13 已把 state 納入版控，但此處漏加，等於只做了一半）。
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: daily gather $(date -u +%F) (GH Actions)"
            # 推送前必須 rebase 重試（2026-08-29 加入）。原本是裸 `git push`：
            # checkout 到 push 之間約有 2 分鐘視窗，期間若雲端 routine 或使用者
            # 本機推了任何 commit，push 就 non-fast-forward 失敗 → job 失敗 →
            # **當天的抓料整包不落地**，而失敗原因看起來像抓取有問題。
            for attempt in 1 2 3; do
              if git push; then
                echo "Pushed gathered data for $(date -u +%F) (attempt $attempt)."
                exit 0
              fi
              echo "Push rejected (attempt $attempt), rebasing onto origin/master…"
              git pull --rebase origin master
            done
            echo "::error::Push failed after 3 attempts — 今日抓料未落地"
            exit 1
          fi


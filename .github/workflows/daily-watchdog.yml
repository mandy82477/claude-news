# 每日產出看門狗（自動化流水線的告警層）
#
# 問題：分裂架構的兩段（① GH Actions 抓料、② 雲端 routine 產日報/wiki/網站）
# 任一段失敗時，整個系統沒有任何告警管道——ABORT 只 append 一行 log 再 commit，
# 而那行 log 沒人看。歷史前科：2026-07-12 追查才發現雲端 routine「從未被建立」，
# 連續兩天無聲空轉；GitHub 也會在高負載時直接丟棄 scheduled workflow（不是延遲，
# 是不跑），疊加起來就是「那天就是沒有，而且沒人知道」。
#
# 解法：本 workflow 在兩段都該完成之後檢查當日產出，缺件就讓 job 失敗——
# GitHub 對失敗的排程 workflow 會寄信給 workflow 檔的最後修改者，這是現成的
# 告警管道，不需要任何額外憑證或第三方服務。
#
# 判讀方式：綠燈＝當日日報已上站；紅燈＝看 summary 指出是哪一段缺件，
# 依 docs/daily-automation.md 的補救路徑本機補跑。
#
# 判準本身不寫在這裡，統一由 scripts/daily_health_check.py 定義
# （2026-08-01 抽出）——因為雲端 routine `daily-watchdog-push` 也要用同一套判準
# 決定要不要推播到手機。兩邊各寫一套的話，遲早會出現「信說壞了、推播說好」，
# 那時你會兩邊都不信。本 workflow 只負責呼叫與把摘要寫進 job summary。
name: daily-watchdog

on:
  schedule:
    # 01:00 UTC。① 抓料 10:23 UTC、② 雲端 routine 最後一班 22:00 UTC（實測 pipeline 約
    # 30–60 分鐘），故最早的安全檢查點落在隔日凌晨。因此查的是**前一個 UTC 日**。
    # 原為 15:00 UTC，那是 routine 還在 13:00 時的配置；routine 改點後不移會天天誤報。
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: 檢查當日產出是否齊全
        run: |
          set -o pipefail
          # （專案根即 repo 根，不需 cd）
          # 摘要同時寫進 job summary 與 stdout：summary 給人看，stdout 讓失敗信裡
          # 直接帶到原因，不必再點進 Actions 頁面
          # 查前一個 UTC 日：本 job 於 01:00 UTC 跑，當日的 pipeline 尚未開始
          python3 scripts/daily_health_check.py --format md \
            --date "$(date -u -d yesterday +%F)" | tee -a "$GITHUB_STEP_SUMMARY"


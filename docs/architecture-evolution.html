```

  讀取中繼資料檔

  → 輸出日報檔案
```

<script>
function toggleEvent(btn) {
  var body = btn.querySelector('.event-body');
  var toggle = btn.querySelector('.event-toggle');
  var hidden = body.hasAttribute('hidden');
  if (hidden) {
    body.removeAttribute('hidden');
    toggle.textContent = '\u2212';
  } else {
    body.setAttribute('hidden', '');
    toggle.textContent = '+';
  }
}

function toggleTrack(btn) {
  btn.classList.toggle('track-btn--active');
  applyFilters();
}

function filterEvents() {
  applyFilters();
}

function applyFilters() {
  var activeTracks = Array.from(document.querySelectorAll('.track-btn--active')).map(function(b){ return b.getAttribute('data-track'); });
  var q = document.getElementById('search-input').value.trim().toLowerCase();
  var wraps = document.querySelectorAll('.event-card-wrap');
  wraps.forEach(function(w){
    var track = w.getAttribute('data-track');
    var matchesTrack = activeTracks.indexOf(track) !== -1;
    var matchesSearch = !q || w.getAttribute('data-search').indexOf(q) !== -1;
    w.style.display = (matchesTrack && matchesSearch) ? '' : 'none';
  });
  // hide month headings with no visible cards
  document.querySelectorAll('.timeline-track').forEach(function(track){
    var anyVisible = Array.from(track.querySelectorAll('.event-card-wrap')).some(function(w){ return w.style.display !== 'none'; });
    var heading = track.previousElementSibling;
    track.style.display = anyVisible ? '' : 'none';
    if (heading && heading.classList.contains('timeline-month')) {
      heading.style.display = anyVisible ? '' : 'none';
    }
  });
}
</script>

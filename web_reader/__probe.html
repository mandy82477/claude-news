<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0}iframe{border:0;width:1300px;height:900px}</style></head>
<body>
<iframe id="f" src="index.html"></iframe>
<script>
  const params = new URLSearchParams(location.search);
  const date = params.get('date') || '2026-07-25';
  const variant = params.get('variant') || 'A'; // A / B / C
  const f = document.getElementById('f');

  const OVERRIDES = {
    A: '', // 現況，無 override
    B: '.story__title { font-size: 19px !important; letter-spacing: -0.01em !important; font-weight: 500 !important; }',
    C: '.story__title { font-size: 21px !important; font-weight: 450 !important; letter-spacing: normal !important; }',
  };

  f.onload = function() {
    const w = f.contentWindow;
    const d = w.document;
    setTimeout(() => {
      w.openDigestPage(date).then(() => {
        // inject override style into iframe document head
        const styleTag = d.createElement('style');
        styleTag.textContent = OVERRIDES[variant] || '';
        d.head.appendChild(styleTag);
        setTimeout(() => {
          // scroll the detail content so 重點話題 section (topStories, first 3 items) is in view
          const heading = Array.from(d.querySelectorAll('.section__h-label')).find(el => el.textContent.replace(/\s/g, '') === '重點話題');
          if (heading) {
            const section = heading.closest('.section');
            section.scrollIntoView({ block: 'start' });
          }
        }, 300);
      });
    }, 800);
  };
</script>
</body></html>
